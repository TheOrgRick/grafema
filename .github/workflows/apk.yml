name: Compilar APK de Android

# Se ejecuta solo: cada vez que subes cambios a la rama principal, o a mano desde la pestaña "Actions".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Solo hace falta pdf-lib de la carpeta principal (sin Electron).
      - name: Instalar dependencias del núcleo
        run: npm install --omit=dev --ignore-scripts

      # Solo las pruebas que no necesitan Electron ni navegador (las de pantalla se corren en la computadora).
      - name: Pruebas del archivo .grafema y de Android
        run: |
          node tests/proyecto-archivo.test.js
          node tests/android.test.js

      - name: Instalar Capacitor
        working-directory: android
        run: npm install --legacy-peer-deps

      # El plugin capacitor-nodejs trae "Bridge.h" pero su código pide "bridge.h": en Windows/Mac funciona,
      # en Linux (el servidor de GitHub) no. Se crea una copia con el nombre en minúsculas.
      - name: Corregir mayúsculas del plugin de Node
        working-directory: android
        run: |
          cpp=node_modules/capacitor-nodejs/android/src/main/cpp
          echo "Versión del plugin:" && node -p "require('./node_modules/capacitor-nodejs/package.json').version"
          echo "Archivos en $cpp:" && ls -la "$cpp"
          h=$(find node_modules/capacitor-nodejs/android -iname 'bridge.h' | head -n 1)
          echo "Encabezado encontrado: ${h:-ninguno}"
          if [ -n "$h" ] && [ ! -f "$cpp/bridge.h" ]; then cp "$h" "$cpp/bridge.h"; echo "Copiado a $cpp/bridge.h"; fi

      - name: Armar interfaz y núcleo
        working-directory: android
        run: node preparar.js

      - name: Crear proyecto Android
        working-directory: android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Grafema-APK
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
